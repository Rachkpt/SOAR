# ══════════════════════════════════════════════════════════════════
#  SOC Automation Pipeline — Infrastructure de lab
#  TheHive 5 + Cassandra + Elasticsearch + MinIO + Cortex + MISP
#
#  Lancement (depuis ce dossier) :
#      cd docker
#      mkdir -p cortex/logs server-configs logs files ssl
#      docker compose up -d
#
#  Elasticsearch n'exige plus de regler vm.max_map_count : la stack
#  utilise node.store.allow_mmap=false. Sur une vraie VM avec les droits
#  necessaires, « sudo sysctl -w vm.max_map_count=262144 » puis
#  ES_ALLOW_MMAP=true donne de meilleures performances.
#
#  ⚠️  Configuration de LAB : mots de passe par défaut, TLS auto-signé,
#      services exposés sur 0.0.0.0. À durcir avant toute mise en ligne.
#
#  Le mot-clé « version: » a été retiré : il est obsolète et provoque
#  un avertissement avec Docker Compose v2.
# ══════════════════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────────────────────────
  # TheHive 5 — gestion des alertes et des cas
  # ────────────────────────────────────────────────────────────────
  thehive:
    image: strangebee/thehive:5.2
    restart: unless-stopped
    depends_on:
      - cassandra
      - elasticsearch
      - minio
      - cortex.local
    mem_limit: 1500m
    ports:
      - "0.0.0.0:9000:9000"
    environment:
      - JVM_OPTS=-Xms1024M -Xmx1024M
    command:
      - --secret
      - "ChangeMoiCeSecretTheHive123456"
      - --cql-hostnames
      - "cassandra"
      - --index-backend
      - "elasticsearch"
      - --es-hostnames
      - "elasticsearch"
      - --s3-endpoint
      - "http://minio:9002"
      - --s3-access-key
      - "minioadmin"
      - --s3-secret-key
      - "minioadmin"
      - --s3-use-path-access-style
    volumes:
      - thehivedata:/etc/thehive
      # Connecteur MISP par fichier (optionnel — la voie recommandée est
      # l'interface TheHive : Organisation → Connectors → MISP).
      # - ./thehive/application.conf:/etc/thehive/application.conf:ro
    networks:
      - SOC_NET

  # ────────────────────────────────────────────────────────────────
  # Cassandra — base de données de TheHive
  # ────────────────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4
    restart: unless-stopped
    ports:
      - "0.0.0.0:9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TheHive
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandradata:/var/lib/cassandra
    networks:
      - SOC_NET

  # ────────────────────────────────────────────────────────────────
  # Elasticsearch — moteur d'index de TheHive et de Cortex
  #
  # Image tirée de Docker Hub et non de docker.elastic.co : ce dernier
  # est souvent injoignable derrière un pare-feu ou un resolveur DNS
  # filtrant, alors que Docker Hub passe (c'est là que sont déjà tirées
  # toutes les autres images de cette stack).
  # Pour revenir au registre Elastic : ES_IMAGE=docker.elastic.co/elasticsearch/elasticsearch:7.17.9
  # ────────────────────────────────────────────────────────────────
  elasticsearch:
    image: ${ES_IMAGE:-elasticsearch:7.17.9}
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "0.0.0.0:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=hive
      - http.host=0.0.0.0
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      # Évite d'avoir à régler vm.max_map_count sur l'hôte. Indispensable
      # en conteneur LXC / Proxmox, où /proc/sys est en lecture seule et
      # où « sysctl -w » échoue avec « Read-only file system ».
      # Elasticsearch bascule alors sur niofs : un peu plus lent que mmapfs,
      # sans conséquence à l'échelle d'un lab.
      - node.store.allow_mmap=${ES_ALLOW_MMAP:-false}
    # Pas de « ulimits: memlock » ici : lever RLIMIT_MEMLOCK est interdit
    # dans un conteneur LXC non privilégié et fait échouer la création du
    # conteneur avec « error setting rlimit type 8: operation not permitted ».
    # Cette limite ne sert qu'avec bootstrap.memory_lock=true, que cette
    # stack n'active pas.
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    networks:
      - SOC_NET

  # ────────────────────────────────────────────────────────────────
  # MinIO — stockage objet des pièces jointes TheHive
  # ────────────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9002"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "0.0.0.0:9002:9002"
    volumes:
      - miniodata:/data
    networks:
      - SOC_NET

  # ────────────────────────────────────────────────────────────────
  # Cortex — moteur d'analyse (analyzers + responders)
  # Le suffixe « .local » est nécessaire : l'assistant de connexion
  # de TheHive n'accepte qu'un FQDN.
  # ────────────────────────────────────────────────────────────────
  cortex.local:
    image: thehiveproject/cortex:latest
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - job_directory=/tmp/cortex-jobs
      - docker_job_directory=/tmp/cortex-jobs
    volumes:
      # Les analyseurs (« neurons ») sont eux-mêmes des conteneurs :
      # Cortex a besoin du socket Docker de l'hôte pour les lancer.
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/cortex-jobs:/tmp/cortex-jobs
      - ./cortex/logs:/var/log/cortex
      - ./cortex/application.conf:/cortex/application.conf
    ports:
      - "0.0.0.0:9001:9001"
    networks:
      - SOC_NET

  # ────────────────────────────────────────────────────────────────
  # MISP — plateforme de Threat Intelligence
  # ────────────────────────────────────────────────────────────────
  misp.local:
    image: coolacid/misp-docker:core-latest
    restart: unless-stopped
    depends_on:
      - misp_mysql
      - redis
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./server-configs/:/var/www/MISP/app/Config/
      - ./logs/:/var/www/MISP/app/tmp/logs/
      - ./files/:/var/www/MISP/app/files
      - ./ssl/:/etc/nginx/certs
    environment:
      - MYSQL_HOST=misp_mysql
      - MYSQL_DATABASE=mispdb
      - MYSQL_USER=mispuser
      - MYSQL_PASSWORD=misppass
      - MISP_ADMIN_EMAIL=mispadmin@lab.local
      - MISP_ADMIN_PASSPHRASE=mispadminpass
      # Renseigner l'IP réelle du serveur, par exemple dans docker/.env :
      #   MISP_BASEURL=https://192.168.1.11
      - MISP_BASEURL=${MISP_BASEURL:-https://localhost}
      - HOSTNAME=${MISP_BASEURL:-https://localhost}
      - TIMEZONE=${TIMEZONE:-Europe/Paris}
      - INIT=true
      - CRON_USER_ID=1
      - REDIS_FQDN=redis
    networks:
      - SOC_NET

  misp_mysql:
    image: mysql/mysql-server:5.7
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=mispdb
      - MYSQL_USER=mispuser
      - MYSQL_PASSWORD=misppass
      - MYSQL_ROOT_PASSWORD=misprootpass
    volumes:
      - mispsqldata:/var/lib/mysql
    networks:
      - SOC_NET

  redis:
    image: redis:latest
    restart: unless-stopped
    networks:
      - SOC_NET

  misp-modules:
    image: coolacid/misp-docker:modules-latest
    restart: unless-stopped
    depends_on:
      - redis
      - misp_mysql
    environment:
      - REDIS_BACKEND=redis
    networks:
      - SOC_NET

volumes:
  thehivedata:
  cassandradata:
  elasticsearchdata:
  miniodata:
  mispsqldata:

networks:
  SOC_NET:
    driver: bridge
