## ═══════════════════════════════════════════════════════════════
##  Cortex — configuration minimale pour le lab SOC
##  Monté dans le conteneur sur /cortex/application.conf
## ═══════════════════════════════════════════════════════════════

## Secret de l'application.
## À CHANGER avant toute exposition hors du lab. Générer un secret :
##   docker run --rm thehiveproject/cortex:latest --secret
play.http.secret.key = "ChangeMoiCortexSecretKey0123456789"

## Index Elasticsearch utilisé par Cortex
search {
  index = cortex
  uri   = "http://elasticsearch:9200"
}

## Catalogues d'analyseurs et de responders téléchargés au démarrage
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]

  ## Les analyseurs tournent dans des conteneurs Docker (neurons) :
  ## le socket Docker de l'hôte est monté dans docker-compose.yml.
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]

  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

## Répertoire de travail partagé entre l'hôte et le conteneur Cortex
job {
  runner = [docker]
  directory = "/tmp/cortex-jobs"
}

## Cache des rapports d'analyse : évite de rejouer un analyseur
## sur le même observable pendant cette durée.
cache.job = 10 minutes
