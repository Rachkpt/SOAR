## ═══════════════════════════════════════════════════════════════
##  TheHive 5 — connecteur MISP (OPTIONNEL)
##
##  Ce fichier n'est PAS monté par défaut dans docker-compose.yml :
##  la méthode recommandée est de brancher MISP depuis l'interface
##  TheHive (Organisation → Connectors → MISP → Add MISP server).
##
##  Il sert de référence si vous préférez la configuration par
##  fichier, par exemple pour une installation de TheHive hors Docker
##  (/etc/thehive/application.conf).
##
##  ⚠️  Ne jamais committer une vraie clé API dans ce fichier.
## ═══════════════════════════════════════════════════════════════

play.modules.enabled += org.thp.thehive.connector.misp.MispModule

misp {
  ## Fréquence de synchronisation des événements MISP
  interval: 1 hour

  servers: [
    {
      name = "MISP"

      ## Nom DNS du conteneur MISP tel que défini dans docker-compose.yml
      url  = "https://misp.local"

      auth {
        type = key
        ## Remplacer par votre clé : MISP → Administration → List Auth Keys
        key  = "REMPLACER_PAR_VOTRE_CLE_API_MISP"
      }

      ## Certificat auto-signé dans un lab : ne pas vérifier le TLS
      wsConfig { ssl { loose { acceptAnyCertificate = true } } }

      ## Tags ajoutés aux alertes importées depuis MISP
      tags = ["misp", "threat-intel"]

      ## Modèle de cas appliqué (doit exister dans TheHive)
      caseTemplate = "misp"
    }
  ]
}
